name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: bootstrap-state
          - path: envs/local-mgmt
          - path: envs/local-dev
          - path: envs/local-prod
          - path: envs/aws-eks
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - uses: terraform-linters/setup-tflint@v4
      - name: Check formatting
        run: terraform fmt -check -recursive terraform
      - name: Initialize without backend
        run: terraform -chdir=terraform/${{ matrix.path }} init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=terraform/${{ matrix.path }} validate
      - name: Lint
        run: tflint --chdir=terraform/${{ matrix.path }}

  manifests:
    name: YAML, Kustomize, and shell checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML
        run: yamllint -c .yamllint .
      - uses: azure/setup-kubectl@v5
        with:
          version: 'v1.35.0'
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz -o /tmp/kubeconform.tar.gz
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - name: Build and validate Kustomize overlays
        run: |
          for overlay in gitops/apps/*/overlays/*; do
            echo "Validating ${overlay}"
            kubectl kustomize "$overlay" | kubeconform -strict -summary -ignore-missing-schemas
          done
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Lint shell scripts
        run: shellcheck scripts/bootstrap.sh scripts/rotate-kubeconfig.sh scripts/cve-report.sh

  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache-dependency-path: |
            sample-app/go.mod
            tools/fleetctl/go.mod
      - name: Test sample app
        working-directory: sample-app
        run: go mod tidy && go test ./...
      - name: Resolve fleetctl dependencies
        working-directory: tools/fleetctl
        run: go mod tidy
      - name: Format Go code
        run: gofmt -w $(find sample-app tools/fleetctl -name '*.go' -type f)
      - name: Test fleetctl
        working-directory: tools/fleetctl
        run: go test ./...
      - name: Lint fleetctl
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: tools/fleetctl
          version: latest

  build:
    name: Build fleetctl (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache-dependency-path: tools/fleetctl/go.mod
      - name: Resolve dependencies
        working-directory: tools/fleetctl
        run: go mod tidy
      - name: Format Go code
        run: gofmt -w $(find tools/fleetctl -name '*.go' -type f)
      - name: Build
        working-directory: tools/fleetctl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o dist/fleetctl-${{ matrix.goos }}-${{ matrix.goarch }} .
      - uses: actions/upload-artifact@v4
        with:
          name: fleetctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tools/fleetctl/dist/fleetctl-${{ matrix.goos }}-${{ matrix.goarch }}
