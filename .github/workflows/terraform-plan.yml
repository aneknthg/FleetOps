name: Terraform plan

on:
  workflow_dispatch:
    inputs:
      role_to_assume:
        description: AWS IAM role ARN trusted for this GitHub repository via OIDC
        required: true
        type: string
      state_bucket:
        description: Existing encrypted/versioned Terraform state bucket
        required: true
        type: string
      region:
        description: AWS region
        required: true
        default: us-east-1
        type: string
      endpoint_public_access_cidrs:
        description: JSON list of allowed API CIDRs, such as ["203.0.113.5/32"]
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Review EKS Terraform plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.region }}
      - name: Initialize remote state
        working-directory: terraform/envs/aws-eks
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ inputs.state_bucket }}" \
            -backend-config="key=fleetops/aws-eks/terraform.tfstate" \
            -backend-config="region=${{ inputs.region }}" \
            -backend-config="use_lockfile=true"
      - name: Create reviewed plan
        working-directory: terraform/envs/aws-eks
        env:
          TF_VAR_endpoint_public_access_cidrs: ${{ inputs.endpoint_public_access_cidrs }}
          TF_VAR_region: ${{ inputs.region }}
        run: terraform plan -input=false -out=fleetops.tfplan
      - name: Export human-readable plan
        working-directory: terraform/envs/aws-eks
        run: terraform show -no-color fleetops.tfplan > fleetops-plan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fleetops-eks-plan-${{ github.run_id }}
          path: terraform/envs/aws-eks/fleetops-plan.txt
          retention-days: 1
