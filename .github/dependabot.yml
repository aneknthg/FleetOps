version: 2
updates:
  - package-ecosystem: docker
    directory: /sample-app
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directories:
      - /sample-app
      - /tools/fleetctl
    schedule:
      interval: weekly
    groups:
      kubernetes-modules:
        patterns:
          - k8s.io/*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories:
      - /terraform/**
    schedule:
      interval: weekly
