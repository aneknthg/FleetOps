apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleetops-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aneknthg/FleetOps.git
    targetRevision: main
    path: gitops/bootstrap
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
